name: Build Cloudstream plugin
on:
  push:
    branches: [main, master]
    paths-ignore: ['*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: src
        run: chmod +x gradlew && ./gradlew make makePluginsJson
      - name: Publish build files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUILDS_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$BUILDS_URL" builds >/dev/null 2>&1; then
            git clone --depth 1 --branch builds "$BUILDS_URL" builds
          else
            mkdir builds
            cd builds
            git init
            git checkout --orphan builds
            git remote add origin "$BUILDS_URL"
            touch .gitkeep
            git add .gitkeep
            git commit -m "Initialize builds branch"
            cd ..
          fi
          cp src/build/plugins.json builds/plugins.json
          find src -type f -name '*.cs3' -exec cp {} builds/ \;
          cp src/repo builds/repo.json
          cd builds
          git add .
          git commit -m "Build $GITHUB_SHA" || true
          git push origin HEAD:builds --force
